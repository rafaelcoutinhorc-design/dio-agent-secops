# LABORATÓRIO: configuração PROPOSITALMENTE INSEGURA para a skill secure-code-review.
# Não use em produção. Todas as senhas são fictícias. Não é preciso subir estes serviços:
# a análise é estática.
services:
  app:
    build: ..
    image: lab-app:latest
    privileged: true
    user: root
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      FLASK_DEBUG: "1"
      DATABASE_URL: "postgresql://admin:admin123@db:5432/lab"
      SECRET_KEY: "lab-secret-nao-use-em-producao"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host
    network_mode: host

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - ./dados:/var/lib/postgresql/data

  proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
