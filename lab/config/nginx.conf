# LABORATÓRIO: configuração PROPOSITALMENTE INSEGURA de proxy reverso para o lab/app.py.
# Não use em produção.
user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens on;

    server {
        listen 80;
        listen 443 ssl;
        server_name lab.local;

        ssl_certificate     /etc/nginx/lab.crt;
        ssl_certificate_key /etc/nginx/lab.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers ALL;

        autoindex on;
        client_max_body_size 0;

        location / {
            proxy_pass http://127.0.0.1:5000;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:5000/admin/;
        }

        location /backup/ {
            alias /var/backups/;
        }
    }
}
